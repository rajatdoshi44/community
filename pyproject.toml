[project]
name = "python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.27.0",
    "my-database",
    "pydantic>=2.13.4",
    "shared-core",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
my-database = { workspace = true }
shared-core = { workspace = true }

[tool.poe.tasks]
start = "uv run uvicorn apps.family_api.main:app --reload --port 8001"
db = "uv run python packages/database/src/my_database/main.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
